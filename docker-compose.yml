services:
  db:
    image: postgres:17
    container_name: ghibli-users-db
    restart: unless-stopped
    # Credenciales desde el .env (ver .env.example)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta en .env}
    # Solo accesible desde esta máquina (para desarrollo local), no desde afuera
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ghibli-users-api
    restart: unless-stopped
    environment:
      # "db" es el nombre del servicio de PostgreSQL dentro de la red de Docker
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SQL_ECHO: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?falta en .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      GHIBLI_BASE_URL: ${GHIBLI_BASE_URL:-https://ghibliapi.vercel.app}
      GHIBLI_CACHE_SECONDS: ${GHIBLI_CACHE_SECONDS:-86400}
      GHIBLI_TIMEOUT_SECONDS: ${GHIBLI_TIMEOUT_SECONDS:-5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
